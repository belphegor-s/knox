# Standalone compose file for deploying apps/api + apps/worker as their OWN Coolify
# application, separate from the knox-web app (infra/docker-compose.yml's default `web`
# service). Deliberately doesn't include `web` or `runner` here:
#  - `web` already exists as its own Coolify app; this file's only job is to give it something
#    to reach at KNOX_API_URL (see infra/nginx.conf's /api/ route) over public HTTPS, matching
#    how every other multi-service project on this account is wired (frontend and backend as
#    separate Coolify apps talking over their own public subdomains, not shared Docker DNS -
#    Coolify doesn't guarantee two independently-deployed apps share a network).
#  - `runner` (the knox-runner image used by docker-runner.ts's sibling containers) is only
#    needed for the local KNOX_EXECUTION_BACKEND=docker path. This deployment is meant to run
#    with KNOX_EXECUTION_BACKEND=ecs (set via Coolify's own environment variable UI, not baked
#    in here) - the worker calls AWS Fargate instead of a local Docker socket, so it needs no
#    Docker socket access on this host at all. Never add the docker.sock volume mount back to
#    this file - this compose file's whole point versus the other one is that it doesn't need
#    (and must not have) privileged host access, since this container is what's actually
#    reachable from the public internet.
#
# api and worker share this file's own compose network regardless of what Coolify does at the
# account level, so `http://worker:8082` below is guaranteed to resolve.
#
# Build contexts are repo-root-relative (`.`, not `..`) on purpose, unlike
# infra/docker-compose.yml's - Coolify's docker-compose deploy always passes
# --project-directory as the repo root regardless of where this file itself sits, and once
# --project-directory is set explicitly, Compose resolves every relative build path against
# THAT, not this file's own infra/ directory. `..` here would reach one level above the repo
# root entirely. This file is Coolify-only (see header) so it's written for that assumption,
# not for local `docker compose -f` invocations.
services:
  # Named "knox-account-db", not "postgres" - Coolify attaches every service in a compose stack
  # to its shared "coolify" Docker network too (needed for `api`'s own public domain routing),
  # and on that network Coolify's own internal control-plane database is already aliased
  # "postgres" (container name coolify-db). A same-named service here would collide with that
  # alias network-wide - hit exactly this once already with apps/session-broker (see its own
  # compose file's comment on the same fix) - so this one is named distinctly from the start.
  #
  # Optional: only apps/api's account/API-key/execution-logging feature needs this (see
  # apps/api/src/server.ts's HAS_DATABASE gate) - the original unauthenticated /api/execute
  # proxy the browser terminal's `run` command uses works with zero database at all. Leave this
  # service and DATABASE_URL out entirely for a deployment that only wants that original path.
  knox-account-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password}
      POSTGRES_DB: knox
    volumes:
      - knox-account-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knox"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      worker:
        condition: service_started
      knox-account-db:
        condition: service_healthy
    environment:
      KNOX_WORKER_URL: http://worker:8082
      DATABASE_URL: postgres://knox:${POSTGRES_PASSWORD}@knox-account-db:5432/knox
      # GitHub sign-in (the only sign-in method) - see docs/cloud-runtime.md "Accounts". The
      # OAuth app's callback URL must be exactly ${KNOX_API_PUBLIC_URL}/auth/github/callback.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      KNOX_API_PUBLIC_URL: ${KNOX_API_PUBLIC_URL:-}
      # ".procd.cc" in production: one sign-in cookie for the landing page, this API, the
      # in-browser IDE, and every <sessionId>.procd.cc VS Code session.
      KNOX_COOKIE_DOMAIN: ${KNOX_COOKIE_DOMAIN:-}
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  knox-account-postgres-data:
