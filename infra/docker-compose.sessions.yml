# Standalone compose file for the public demo's session broker, deployed as its own Coolify
# application (mirrors infra/docker-compose.cloud-execution.yml's reasoning for knox-api being
# separate from knox-web). Not part of the self-hosted docker-compose.yml - self-hosting a
# single unrestricted `vscode` container needs no database, no orchestrator, and no usage caps
# at all, so bundling this in there would force unrelated infrastructure on every self-hoster.
#
# Build contexts are repo-root-relative (`.`), matching docker-compose.cloud-execution.yml's own
# fix for this - Coolify's docker-compose deploy always passes --project-directory as the repo
# root regardless of where this file itself sits.
services:
  # Named "knox-sessions-db", not "postgres" - Coolify attaches every service in this compose
  # stack to its own shared "coolify" Docker network (needed for session-broker's Traefik
  # routing below), and on THAT network Coolify's own internal control-plane database
  # container is already aliased "postgres" (its container is named "coolify-db"). A same-named
  # service here collides with that alias network-wide: DNS resolution for "postgres" can land
  # on either database depending on which one Docker's embedded DNS happens to answer with, and
  # Postgres deliberately returns the identical "password authentication failed" error whether
  # the password is wrong OR the role doesn't exist at all (to avoid leaking which is true) - so
  # this surfaced as an auth failure with a verified-correct password, not a hostname problem.
  # Confirmed by reproducing it directly: the exact same image+credentials succeeded when only
  # attached to this stack's own network, and failed the same way whenever also attached to the
  # shared "coolify" network - a symptom of hitting the wrong "postgres", not a bad credential.
  knox-sessions-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password}
      POSTGRES_DB: knox
    volumes:
      - knox-sessions-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knox"]
      interval: 10s
      timeout: 3s
      retries: 5

  session-broker:
    build:
      context: .
      dockerfile: apps/session-broker/Dockerfile
    depends_on:
      knox-sessions-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://knox:${POSTGRES_PASSWORD}@knox-sessions-db:5432/knox
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      KNOX_ECS_CLUSTER: ${KNOX_ECS_CLUSTER:-knox-execution}
      KNOX_VSCODE_TASK_DEFINITION: ${KNOX_VSCODE_TASK_DEFINITION:-knox-vscode}
      KNOX_VSCODE_CONTAINER_NAME: ${KNOX_VSCODE_CONTAINER_NAME:-knox-vscode}
      KNOX_ECS_SUBNETS: ${KNOX_ECS_SUBNETS}
      KNOX_VSCODE_SECURITY_GROUPS: ${KNOX_VSCODE_SECURITY_GROUPS}
      KNOX_SESSION_DOMAIN: ${KNOX_SESSION_DOMAIN:-procd.cc}
      KNOX_HOME_URL: ${KNOX_HOME_URL:-https://knox.procd.cc/}
    ports:
      - "8083:8083"
    restart: unless-stopped
    # Coolify's own managed domain (sessions.procd.cc, set via its docker_compose_domains API
    # field, not in this file) exists ONLY to make Coolify attach this container to its shared
    # Traefik network and give it a real Let's Encrypt cert for a fixed health-check URL - it
    # provisions ONE static FQDN, but every session mints its own random subdomain
    # (<sessionId>.procd.cc) that can't be pre-registered that way. The actual session routing
    # is this hand-written wildcard router instead. See docs/cloud-runtime.md for why the
    # *.procd.cc DNS record is proxied through Cloudflare (free Universal SSL covers exactly one
    # level under the registered zone) rather than each session getting its own real certificate,
    # which would burn through Let's Encrypt's per-registered-domain rate limit shared with every
    # other app on procd.cc within a few dozen sessions.
    labels:
      - traefik.enable=true
      # Coolify's docker_compose_domains config puts this container on more than one Docker
      # network (its own compose network plus the shared Traefik one) - without pinning the
      # network explicitly, Traefik can't tell which one to route this custom service through
      # and silently serves "no available server" for it (Coolify's own auto-generated router
      # doesn't have this problem because Coolify tags its own labels with the network itself).
      - traefik.docker.network=coolify
      - traefik.http.routers.knox-sessions.rule=HostRegexp(`^.+\.procd\.cc$`)
      - traefik.http.routers.knox-sessions.entrypoints=https
      - traefik.http.routers.knox-sessions.tls=true
      # Coolify's own auto-generated http-0-.../https-0-... services live on this same
      # container (for the sessions.procd.cc domain above), so Traefik can't infer which
      # service this router means from same-name matching alone - it needs to be explicit
      # ("Router knox-sessions cannot be linked automatically with multiple Services").
      - traefik.http.routers.knox-sessions.service=knox-sessions
      # Traefik's default priority is the rule string's length, and this regex rule is a long
      # string - without pinning it low, it could outrank other apps' plain Host(`x.procd.cc`)
      # routers and steal their traffic. Every other app's exact-match router must always win;
      # this only catches requests nothing else claims.
      - traefik.http.routers.knox-sessions.priority=1
      - traefik.http.services.knox-sessions.loadbalancer.server.port=8083

volumes:
  knox-sessions-postgres-data:
