server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Used (below) so the /api/ upstream resolves lazily per-request
    # instead of at nginx startup - a static `proxy_pass http://api:8081` would fail to
    # resolve and crash the whole server when the api/worker containers aren't deployed,
    # which must keep working for the base single-container deployment.
    resolver 127.0.0.11 valid=10s;

    # Required for SharedArrayBuffer / WASM threading (SPEC section 41).
    # If you put another reverse proxy in front of this container (Coolify,
    # Traefik, Cloudflare), it must forward these headers unchanged -
    # stripping them silently disables threaded WASM runtimes. See
    # docs/architecture.md "Cross-origin isolation".
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A `types {}` block here would *replace* nginx's whole built-in MIME
    # table rather than extend it - so .wasm gets its own location instead
    # of redeclaring the map (which silently broke every other content type).
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Optional cloud execution API (apps/api -> apps/worker). Only meaningful if those
    # containers are actually running (see infra/docker-compose.yml) - if not, this 502s
    # and the frontend's cloud-execution client treats that the same as "not deployed".
    # proxy_buffering off is required: /api/execute streams NDJSON as the sandboxed program
    # runs, and buffering would hold the whole response until the container exits.
    location /api/ {
        # No path after $api_upstream: with a variable in proxy_pass, nginx can't do its
        # usual prefix-rewrite, so any literal path here would replace the request's actual
        # path instead of extending it. Passing the host only forwards the original URI
        # (/api/execute) unchanged, which is exactly what apps/api's route expects.
        #
        # KNOX_API_UPSTREAM (envsubst'd in at container start - see infra/Dockerfile) defaults
        # to the Docker-DNS name the self-hosted docker-compose.yml path resolves. A deployment
        # where api/worker run as their own separate app (infra/docker-compose.cloud-execution.yml,
        # no shared network to resolve "api" on) overrides it to that app's own public URL
        # instead - set as an env var on the knox-web Coolify app, not hardcoded here. The
        # 127.0.0.11 resolver above handles both cases: Docker's embedded DNS forwards anything
        # that isn't a local container name to the container's normal upstream resolvers, so it
        # resolves public hostnames too, not just compose service names.
        set $api_upstream "${KNOX_API_UPSTREAM}";
        proxy_pass $api_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # 90s, not the old 35s: the ECS Fargate execution backend's cold start (task
        # provisioning + image pull) alone commonly takes 10-30s before the sandboxed program
        # even starts running, on top of its own execution time - see
        # apps/worker/src/ecs-runner.ts's own 90s TASK_TIMEOUT_MS, which this must not cut off
        # before it has a chance to fire.
        proxy_read_timeout 90s;
    }

    # Public-demo session creation (apps/session-broker), same pattern as /api/ above: a
    # variable in proxy_pass defers DNS to request time via the resolver, so this container
    # keeps starting fine when no session broker is deployed at all (the default self-hosted
    # path - KNOX_SESSION_API_UPSTREAM is empty, this just 502s, and the landing page's JS
    # treats that as "no public demo available here"). Kept as its own location distinct from
    # the general /api/ prefix above (which targets a different, unrelated upstream) since
    # nginx matches the longest prefix regardless of declaration order.
    location /api/sessions {
        set $session_api_upstream "${KNOX_SESSION_API_UPSTREAM}";
        proxy_pass $session_api_upstream;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Matches session-broker's own TASK_START_TIMEOUT_MS (150s) for a Fargate cold start.
        proxy_read_timeout 155s;
    }

    # The service worker and its manifest must always revalidate - an
    # aggressively cached sw.js can pin users to a stale app shell forever.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable; cache them hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sign-in gate for the in-browser IDE (/app/ below), via auth_request against apps/api's
    # GET /auth/whoami - the browser's cookies ride along on the subrequest unchanged, so the
    # same GitHub sign-in (a .procd.cc-scoped cookie) that gates VS Code sessions gates this too.
    # Off unless KNOX_REQUIRE_AUTH=true: a self-hosted single container has no account service
    # to ask, and must keep serving the IDE with zero configuration. `internal` means only
    # auth_request subrequests reach this, never a browser.
    location = /__knox/auth {
        internal;
        set $knox_require_auth "${KNOX_REQUIRE_AUTH}";
        if ($knox_require_auth != "true") {
            return 204;
        }
        # A full path after the variable on purpose (see /api/ below for why that REPLACES the
        # request path): the subrequest's own URI is /__knox/auth, and this rewrites it wholesale.
        set $auth_upstream "${KNOX_API_UPSTREAM}";
        proxy_pass $auth_upstream/auth/whoami;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location @knox_sign_in {
        # A fixed return path rather than $request_uri: it'd need URL-encoding to survive as a
        # query parameter, and everything under /app/ is one client-side-routed page anyway.
        return 302 "${KNOX_SIGN_IN_URL}?redirect=https://$host/app/";
    }

    # The actual IDE - a separate index.html from the root marketing landing page. Nginx
    # picks the longest matching prefix among these location blocks regardless of file
    # order, so this always wins over the catch-all below for anything under /app/.
    location = /app/index.html {
        auth_request /__knox/auth;
        error_page 401 = @knox_sign_in;
        add_header Cache-Control "no-cache";
    }
    location /app/ {
        auth_request /__knox/auth;
        error_page 401 = @knox_sign_in;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
