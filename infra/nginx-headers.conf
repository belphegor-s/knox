# Response headers every Knox page needs, included by the server block AND by every location
# that sets its own add_header. nginx only inherits add_header from an outer level when the
# current level defines none, so a location adding just Cache-Control silently loses all of
# these - which is how / and /app/ were being served without cross-origin isolation.
#
# Required for SharedArrayBuffer / WASM threading (SPEC section 41). If you put another reverse
# proxy in front of this container (Coolify, Traefik, Cloudflare), it must forward these
# unchanged - stripping them silently disables threaded WASM runtimes. See docs/architecture.md
# "Cross-origin isolation".
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Content-Type-Options "nosniff" always;
