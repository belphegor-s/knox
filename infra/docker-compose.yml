# `docker compose up` alone gives a self-hoster real VS Code (the `vscode` service below) with
# no restrictions of any kind - no session time limit, no language limit, no auth gate. That's
# the whole point of self-hosting versus the public knox.procd.cc demo, which puts the SAME
# vscode-runner image behind apps/session-broker's 15-minute/30-minutes-per-day orchestration
# instead (see docs/cloud-runtime.md). `web` (the original custom Monaco/xterm/OPFS shell) is
# kept running alongside it, not replaced - it's a real, working, just-stabilized product on
# its own, just no longer the primary path. The api/worker/runner services are the OPTIONAL
# batch code-execution path - bring them up too (`docker compose --profile cloud-execution up`)
# only if you want that; nothing about the base deployment depends on them.
services:
  vscode:
    build:
      context: .
      dockerfile: vscode-runner.Dockerfile
    ports:
      - "${KNOX_VSCODE_PORT:-8090}:8080"
    environment:
      # No PASSWORD set: self-hosted means no auth gate by default. Set PASSWORD yourself
      # (docker compose run -e PASSWORD=... or a .env file) if this host is reachable by
      # anyone other than you.
      PASSWORD: ${KNOX_VSCODE_PASSWORD:-}
    volumes:
      - knox-vscode-data:/home/coder/project
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "${KNOX_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --- optional cloud execution (Python/C/C++/Java/Go/Rust) --------------------------------
  runner:
    profiles: ["cloud-execution"]
    build:
      context: .
      dockerfile: runner.Dockerfile
    image: knox-runner:latest
    # This service never runs on its own - it only exists so `docker compose build` produces
    # the image apps/worker's docker-runner.ts spawns sibling containers from.
    entrypoint: ["true"]

  worker:
    profiles: ["cloud-execution"]
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      - runner
    environment:
      KNOX_RUNNER_IMAGE: knox-runner:latest
    volumes:
      # Docker-outside-of-Docker: this container has no daemon of its own and spawns every
      # execution as a SIBLING container on the host via this socket, never nested inside
      # itself. See apps/worker/src/docker-runner.ts and docs/security.md.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    profiles: ["cloud-execution"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      - worker
    environment:
      KNOX_WORKER_URL: http://worker:8082
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  knox-vscode-data:
